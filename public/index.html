<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo Công an Hà Nội</title>
<meta name="description" content="Báo Công an Hà Nội - Thông tin an ninh trật tự, pháp luật, giao thông và đời sống Thủ đô.">
<meta name="theme-color" content="#3d0506">
<meta property="og:title" content="Báo Công an Hà Nội">
<meta property="og:description" content="Thông tin an ninh trật tự, pháp luật, giao thông và đời sống Thủ đô.">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Russo+One&family=Barlow:ital,wght@0,400;0,800;1,400;1,800&family=Barlow+Condensed:wght@700;800&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">

<section class="hero" id="hero" aria-label="Tin nổi bật">
  <div id="slides"></div>
  <div class="dots" id="dots"></div>
  <div class="h-arrows"><button id="hPrev" aria-label="Tin trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button id="hNext" aria-label="Tin sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
</section>

<section class="matches" id="giai-dau" aria-labelledby="gd-h">
  <div class="wrap"><h2 class="sec-h" id="gd-h">Giải đấu</h2><div class="m-grid" id="matches"></div></div>
</section>

<section class="block" id="dong-chay">
  <div class="wrap">
    <div class="block-head"><h2 class="sec-h" data-title="dong-chay">Dòng chảy</h2><a class="pill ghost" href="section.html?s=dong-chay">Đọc tất cả</a></div>
    <div id="list-dong-chay"></div>
  </div>
</section>

<section class="since" id="ve-chung-toi" aria-label="Giới thiệu"><div class="glitch" id="glitch"></div></section>

<section class="squad" id="doi-hinh">
  <div class="wrap">
    <div class="block-head"><h2 class="sec-h">Đội hình</h2>
      <div class="arrows"><button class="arrow-btn" id="sqPrev" aria-label="Trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button class="arrow-btn" id="sqNext" aria-label="Sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button></div>
    </div>
    <div class="sq-viewport"><div class="sq-track" id="sqTrack"></div></div>
    <div class="sq-dots" id="sqDots"></div>
    <div class="center"><button class="pill ghost big" id="sqAll">Xem tất cả</button></div>
  </div>
</section>

<section class="block" id="lan-bong">
  <div class="wrap"><div class="block-head"><h2 class="sec-h" data-title="lan-bong">Lăn bóng</h2></div><div class="bento" id="list-lan-bong"></div></div>
</section>

<section class="block">
  <div class="wrap two-col">
    <div id="ben-le-san-co"><div class="block-head"><h2 class="sec-h" data-title="ben-le-san-co">Bên lề sân cỏ</h2></div><ul class="list" id="list-ben-le-san-co"></ul></div>
    <div id="nguoi-ham-mo"><div class="block-head"><h2 class="sec-h" data-title="nguoi-ham-mo">Người hâm mộ</h2></div><ul class="list" id="list-nguoi-ham-mo"></ul></div>
  </div>
</section>

<section class="block" id="multimedia" style="padding-left:0;padding-right:0">
  <div class="mm" id="mm"><h2>Multimedia</h2></div>
  <div class="wrap mm-list" id="mmList" style="padding:0 var(--gutter)"></div>
</section>

<section class="shop" id="cua-hang">
  <div class="wrap"><h2 id="shopTitle">Cửa hàng chính thức</h2><p class="sub" id="shopSub">Sản phẩm bán chạy nhất</p>
    <div class="podium" id="podium"></div></div>
</section>

<section class="honors" id="thanh-tich">
  <div class="h-banner" id="hBanner"><h2 id="hTitle">CÔNG AN HÀ NỘI FC</h2></div>
  <div class="h-card">
    <div class="h-tools">
      <div class="h-per" role="tablist"><span>Giai đoạn</span><button class="on" data-p="0">1960 - 1989</button><button data-p="1">1990 - 2009</button><button data-p="2">2010 - 2026</button></div>
      <select class="h-sel" id="hSel" aria-label="Lọc giải đấu"><option value="">Tất cả giải đấu</option></select>
    </div>
    <div class="h-rows" id="hRows"></div>
  </div>
</section>


<script src="demo.js"></script>
<script src="common.js"></script>
<script src="layout.js"></script>
<script src="script.js"></script>
</body>
</html>
