<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyên mục - CLB Bóng đá Công An Hà Nội</title>
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,600;1,300;1,800&display=swap" rel="stylesheet">
<script src="fit.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sections.css">
</head>
<body data-header="solid">
<script>{ const s = new URLSearchParams(location.search).get('s'); if (s === 'doi-hinh' || s === 'dong-chay') document.body.classList.add('pg-red', s === 'dong-chay' ? 'pg-news' : 'pg-squad'); }</script>
<section class="article-hero"><div class="wrap list-wrap"><h1 id="t">Chuyên mục</h1></div></section>
<main class="list-page" id="main">
  <div id="special"></div>
  <div class="n-grid" id="grid"></div>
</main>
<script src="demo.js"></script>
<script src="common.js"></script>
<script src="sponsors-map.js"></script>
<script src="layout.js"></script>
<script src="sections.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('s') || '';
  const [secs, all, siteData] = await Promise.all([getJSON('/api/sections', []), getJSON('/api/articles', []), getJSON('/api/site', null)]);
  const site = siteData && siteData.hero ? siteData : window.DEMO_SITE;
  const sec = secs.find(s => s.id === id);
  const name = sec ? sec.name : 'Chuyên mục';
  $('#t').textContent = name; document.title = name + ' - CLB Bóng đá Công An Hà Nội';
  // phần đặc biệt của từng chuyên mục
  if (id === 'doi-hinh') return renderSquadPage(site, all);
  if (id === 'dong-chay') return renderNewsPage(site, all, id, name);
  if (id === 've-chung-toi') {
    const h = site.honors;
    $('#special').innerHTML = `<div class="about-intro"><div class="glitch" style="font-size:clamp(34px,calc(7 * var(--vw)),96px)"><span>${esc(site.intro.line1)}</span><span>${esc(site.intro.line2)}</span></div></div>
    <section class="honors" style="border-radius:18px;overflow:hidden;margin:10px 0 44px"><div class="h-banner" id="hBanner" style="height:clamp(160px,calc(22 * var(--vw)),300px)"><h2 id="hTitle"></h2></div>
    <div class="h-card"><div class="h-tools"><div class="h-per"><span>Giai đoạn</span><button class="on" data-p="0">1960 - 1989</button><button data-p="1">1990 - 2009</button><button data-p="2">2010 - 2026</button></div><select class="h-sel" id="hSel"><option value="">Tất cả giải đấu</option></select></div><div class="h-rows" id="hRows"></div></div></section>
    <h2 class="sec-h" style="margin:10px 0 22px">Bài viết</h2>`;
    renderHonors(h);
  }
  const list = demoOr(all).filter(a => a.section === id);
  $('#grid').innerHTML = list.length ? list.map((a, i) => `<a class="n-card rv" style="--d:${(i % 3) * .08}s" href="${href(a)}"><div class="th">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : `<div class="ph p${i % 5 + 1}"></div>`}${hasVideo(a) ? ICON_PLAY : ''}</div><h3>${esc(a.title)}</h3><time>${fmtDate(a.createdAt)}</time></a>`).join('') : '<p class="empty">Chưa có bài viết trong chuyên mục này.</p>';
  reveal();
})();
</script>
</body>
</html>
