<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuyên mục - Báo Công an Hà Nội</title>
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header solid-always">
  <a class="brand" href="index.html"><img src="assets/logo.png" alt="Trang chủ"></a>
  <div class="actions"><a class="pill outline" href="index.html">← Trang chủ</a></div>
</header>
<section class="article-hero"><div class="wrap"><h1 id="t">Chuyên mục</h1></div></section>
<main class="list-page"><div class="n-grid" id="grid"></div></main>
<script src="demo.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
(async () => {
  const id = new URLSearchParams(location.search).get('s') || '';
  let secs = [], all = [];
  try { [secs, all] = await Promise.all([fetch('/api/sections').then(r => r.json()), fetch('/api/articles').then(r => r.json())]); } catch {}
  if (!Array.isArray(all) || !all.length) all = window.DEMO_ARTICLES || [];
  const sec = (Array.isArray(secs) ? secs : []).find(s => s.id === id);
  document.getElementById('t').textContent = sec ? sec.name : 'Chuyên mục';
  document.title = (sec ? sec.name : 'Chuyên mục') + ' - Báo Công an Hà Nội';
  const list = all.filter(a => a.section === id);
  document.getElementById('grid').innerHTML = list.length ? list.map((a, i) => {
    const d = new Date(a.createdAt);
    return `<a class="n-card" href="article.html?id=${encodeURIComponent(a.id)}"><div class="th">${a.image ? `<img src="${esc(a.image)}" alt="">` : `<div class="ph p${i % 5 + 1}"></div>`}</div><h3>${esc(a.title)}</h3><time>${p2(d.getHours())}:${p2(d.getMinutes())} ${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()}</time></a>`;
  }).join('') : '<p class="empty">Chưa có bài viết trong chuyên mục này.</p>';
})();
</script>
</body>
</html>
