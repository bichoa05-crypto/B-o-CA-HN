<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Về chúng tôi - CLB Công An Hà Nội</title>
<meta name="description" content="Giới thiệu, danh hiệu, lịch sử, ban lãnh đạo và sân nhà của Câu lạc bộ Bóng đá Công An Hà Nội - thành lập ngày 10/10/1956.">
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="about.css">
</head>
<body>

<header class="ab-hero">
  <div class="wrap">
    <div class="ab-kicker">CLB Công An Hà Nội</div>
    <h1>Về chúng tôi</h1>
    <p id="abSub"></p>
    <div class="ab-facts" id="abFacts"></div>
  </div>
</header>

<nav class="ab-tabs" aria-label="Mục lục"><div class="in">
  <a href="#gioi-thieu">Giới thiệu</a><a href="#danh-hieu">Danh hiệu</a><a href="#lich-su">Lịch sử</a><a href="#ban-lanh-dao">Ban lãnh đạo</a><a href="#san-nha">Sân nhà</a>
</div></nav>

<main>
<section class="ab-sec" id="gioi-thieu"><div class="ab-in narrow">
  <div class="ab-head"><h2 class="sec-h">Giới thiệu</h2></div>
  <div class="ab-text" id="abText">
    <div class="ab-fade" id="abFade"></div>
    <div class="ab-more" id="abMore"></div>
    <button type="button" class="pill ghost ab-toggle" id="abToggle" aria-expanded="false">Đọc tiếp</button>
  </div>
</div></section>

<section class="ab-sec alt" id="danh-hieu"><div class="ab-in">
  <div class="ab-head"><h2 class="sec-h">Danh hiệu</h2><p id="trIntro"></p></div>
  <div class="tr-wrap">
    <button class="tr-btn tr-prev" id="trPrev" aria-label="Trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <button class="tr-btn tr-next" id="trNext" aria-label="Sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    <div class="tr-track" id="trTrack" tabindex="0" aria-label="Danh sách danh hiệu"></div>
  </div>
  <div class="tr-count" id="trCount"></div>
</div></section>

<section class="ab-sec" id="lich-su"><div class="ab-in narrow">
  <div class="ab-head"><h2 class="sec-h">Lịch sử</h2></div>
  <div class="tl" id="tl"></div>
</div></section>

<section class="ab-sec alt" id="ban-lanh-dao"><div class="ab-in">
  <div class="ab-head"><h2 class="sec-h">Ban lãnh đạo</h2></div>
  <div class="ld-grid" id="ldGrid"></div>
</div></section>

<section class="ab-sec" id="san-nha"><div class="ab-in">
  <div class="ab-head"><h2 class="sec-h">Sân nhà</h2></div>
  <div id="stView"></div>
  <div class="st-info" id="stInfo"></div>
  <div class="st-map" id="stMap"></div>
</div></section>
</main>

<script src="demo.js"></script>
<script src="common.js"></script>
<script src="about-default.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  const site = await fetch('/api/site').then(r => r.ok ? r.json() : null).catch(() => null);
  const A = { ...ABOUT_DEFAULT, ...((site && site.about) || {}) };
  A.stadium = { ...ABOUT_DEFAULT.stadium, ...(A.stadium || {}) };
  const $ = s => document.querySelector(s);
  const lines = t => String(t || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

  // đầu trang
  $('#abSub').textContent = A.heroSub;
  $('#abFacts').innerHTML = (A.facts || []).map(f => `<div class="ab-fact"><b>${esc(f.num)}</b><span>${esc(f.label)}</span></div>`).join('');

  // giới thiệu
  const ps = lines(A.intro).map(p => `<p>${esc(p)}</p>`);
  $('#abFade').innerHTML = ps.slice(0, 2).join(''); $('#abMore').innerHTML = ps.slice(2).join('');
  const box = $('#abText'), tg = $('#abToggle');
  if (ps.length <= 2) { tg.hidden = true; box.classList.add('open'); }
  tg.onclick = () => { const o = box.classList.toggle('open'); tg.textContent = o ? 'Thu gọn' : 'Đọc tiếp'; tg.setAttribute('aria-expanded', o); };

  // danh hiệu
  const GOLD = ['#fff3b0', '#f2c230', '#b67a0a'], SILVER = ['#ffffff', '#c9ccd3', '#7b7f89'], BRONZE = ['#ffe2c4', '#d99a62', '#8f5426'];
  const cup = ([c1, c2, c3], id) => `<svg viewBox="0 0 100 120" aria-hidden="true"><defs><linearGradient id="g${id}" x1="0" x2="1"><stop offset="0" stop-color="${c3}"/><stop offset=".35" stop-color="${c1}"/><stop offset=".7" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient></defs>
    <path d="M24 18C8 16 6 40 26 50M76 18c16-2 18 22-2 32" fill="none" stroke="url(#g${id})" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 12h56c0 30-8 48-28 54C30 60 22 42 22 12z" fill="url(#g${id})"/>
    <path d="M32 18c0 22 6 34 14 40" stroke="#fff9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="45" y="64" width="10" height="20" fill="url(#g${id})"/><rect x="34" y="82" width="32" height="8" rx="2" fill="url(#g${id})"/>
    <rect x="28" y="90" width="44" height="16" rx="3" fill="#2a1a14"/><rect x="34" y="95" width="32" height="2.6" rx="1" fill="${c2}"/><rect x="34" y="100" width="22" height="2.6" rx="1" fill="${c2}"/></svg>`;
  const T = { champion: ['v', 'Vô địch', GOLD], runner: ['a', 'Á quân', SILVER], third: ['b', 'Hạng ba', BRONZE] };
  const tr = A.trophies || [];
  $('#trIntro').textContent = A.trophiesIntro || '';
  const track = $('#trTrack');
  track.innerHTML = tr.map((x, i) => { const [c, n, col] = T[x.result] || T.champion; return `<article class="tr-card ${c}">${cup(col, i)}<h3>${n}</h3><p>${esc(x.name)}</p><b>${esc(x.year)}</b></article>`; }).join('');
  const cnt = k => tr.filter(x => x.result === k).length;
  $('#trCount').innerHTML = `<span><b>${cnt('champion')}</b>lần vô địch</span><span><b>${cnt('runner')}</b>lần á quân</span><span><b>${cnt('third')}</b>lần hạng ba</span>`;
  const prev = $('#trPrev'), next = $('#trNext');
  const upd = () => { prev.disabled = track.scrollLeft < 4; next.disabled = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4; };
  const step = () => { const c = track.querySelector('.tr-card'); return c ? (c.offsetWidth + 18) * 2 : 300; };
  prev.onclick = () => track.scrollBy({ left: -step(), behavior: 'smooth' });
  next.onclick = () => track.scrollBy({ left: step(), behavior: 'smooth' });
  track.addEventListener('scroll', upd, { passive: true }); addEventListener('resize', upd); upd();
  track.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next.click(); if (e.key === 'ArrowLeft') prev.click(); });

  // lịch sử
  $('#tl').innerHTML = (A.history || []).map((s, i) => `<article class="tl-item" data-n="${i + 1}"><h3>${esc(s.title)}</h3>${s.when ? `<span class="when">${esc(s.when)}</span>` : ''}${lines(s.body).map(p => `<p>${rich(p)}</p>`).join('')}</article>`).join('');

  // ban lãnh đạo
  const ini = n => n.split(' ').slice(-2).map(w => w[0]).join('').toUpperCase();
  $('#ldGrid').innerHTML = (A.leaders || []).map(p => `<div class="ld"><div class="av">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">` : esc(ini(p.name || ''))}</div><div><small>${esc(p.role)}</small><h3>${esc(p.name)}</h3><p>${esc(p.note)}</p></div></div>`).join('');

  // sân nhà
  const S = A.stadium, q = encodeURIComponent(S.mapQuery || S.address || S.name);
  $('#stView').innerHTML = S.image
    ? `<div class="st photo"><img src="${esc(S.image)}" alt="${esc(S.name)}"><div class="tag">${esc(S.tag || S.address)}</div></div>`
    : `<div class="st" role="img" aria-label="${esc(S.name)}"><div class="pitch"></div><div class="track"></div><div class="stand"></div><div class="lines"></div><div class="box l"></div><div class="box r"></div><div class="tag">${esc(S.tag || S.address)}</div></div>`;
  $('#stInfo').innerHTML = `<div class="st-box"><small>Sân vận động</small><b>${esc(S.name)}</b></div><div class="st-box"><small>Sức chứa</small><b>${esc(S.capacity)}</b></div><div class="st-box"><small>Địa chỉ</small><b>${esc(S.address)}</b><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Mở bản đồ →</a></div>`;
  $('#stMap').innerHTML = `<iframe title="Bản đồ ${esc(S.name)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${q}&output=embed"></iframe>`;

  // mục lục dính
  const links = [...document.querySelectorAll('.ab-tabs a')];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  links.forEach(a => { const s = document.querySelector(a.getAttribute('href')); if (s) io.observe(s); });
})();
</script>
</body>
</html>
