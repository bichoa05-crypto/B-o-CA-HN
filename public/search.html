<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm kiếm - Báo Công an Hà Nội</title>
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-header="solid">
<section class="article-hero"><div class="wrap list-wrap"><h1>Tìm kiếm</h1>
  <form class="big-search" action="search.html" method="get"><input name="q" id="sq" type="search" placeholder="Nhập từ khoá..." minlength="2" required><button class="pill solid">Tìm</button></form></div></section>
<main class="list-page"><p class="hint-res" id="res"></p><div class="n-grid" id="grid"></div></main>
<script src="demo.js"></script>
<script src="common.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  const q = (new URLSearchParams(location.search).get('q') || '').trim();
  $('#sq').value = q; document.title = (q ? q + ' - ' : '') + 'Tìm kiếm - Báo Công an Hà Nội';
  if (q.length < 2) { $('#res').textContent = 'Nhập ít nhất 2 ký tự để tìm kiếm.'; return; }
  const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
  let list = await getJSON('/api/search?q=' + encodeURIComponent(q), null);
  if (list === null || (!list.length && !(await getJSON('/api/articles', [])).length)) {
    const ws = norm(q).split(/\s+/); // bản xem thử tĩnh: lọc trên bài mẫu
    list = (window.DEMO_ARTICLES || []).filter(a => ws.every(w => norm(a.title + ' ' + a.summary).includes(w)));
  }
  $('#res').innerHTML = list.length ? `Tìm thấy <b>${list.length}</b> bài viết cho "<b>${esc(q)}</b>"` : `Không tìm thấy bài viết nào cho "<b>${esc(q)}</b>". Hãy thử từ khoá khác.`;
  $('#grid').innerHTML = list.map((a, i) => `<a class="n-card" href="${href(a)}"><div class="th">${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy">` : `<div class="ph p${i % 5 + 1}"></div>`}${hasVideo(a) ? ICON_PLAY : ''}</div><h3>${esc(a.title)}</h3><time>${fmtDate(a.createdAt)}</time></a>`).join('');
})();
</script>
</body>
</html>
