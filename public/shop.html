<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cửa hàng - Báo Công an Hà Nội</title>
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-header="solid">
<section class="article-hero"><div class="wrap list-wrap"><h1 id="t">Cửa hàng chính thức</h1><p class="sub" id="sub" style="opacity:.8;margin-top:6px"></p></div></section>
<main class="list-page"><div class="shop-grid" id="grid"></div></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="demo.js"></script>
<script src="common.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  const siteData = await getJSON('/api/site', null);
  const site = siteData && siteData.hero ? siteData : window.DEMO_SITE;
  const s = site.shop;
  $('#t').textContent = s.title; $('#sub').textContent = s.subtitle;
  const prods = s.products.map((p, i) => ({ ...p, id: p.id || 'demo' + i }));
  $('#grid').innerHTML = prods.length ? prods.map(p => `
    <article class="prod rv" id="${esc(p.id)}">
      <div class="prod-pic">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">` : SHIRT}</div>
      <h3>${esc(p.name)}</h3>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
      <div class="price">${p.price ? money(p.price) : 'Liên hệ'}</div>
      <div class="prod-act">${p.price ? `<button class="pill ghost" data-add="${esc(p.id)}">Thêm vào giỏ</button><button class="pill solid" data-buy="${esc(p.id)}">Mua ngay</button>` : '<a class="pill ghost" href="#lien-he">Liên hệ để mua</a>'}</div>
    </article>`).join('') : '<p class="empty">Cửa hàng đang cập nhật sản phẩm.</p>';
  reveal();
  const t = $('#toast');
  $('#grid').addEventListener('click', e => {
    const a = e.target.closest('[data-add]'), b = e.target.closest('[data-buy]');
    if (a) { cart.add(a.dataset.add); t.textContent = 'Đã thêm vào giỏ hàng'; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 1800); }
    if (b) { cart.add(b.dataset.buy); location.href = 'cart.html'; }
  });
  if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); } }
})();
</script>
</body>
</html>
