<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLB Bóng đá Công An Hà Nội</title>
<meta name="theme-color" content="#4a0d09">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="fit.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rich.css">
<link rel="stylesheet" href="gallery.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-header="solid">
<section class="article-hero"><div class="wrap" id="ahead"></div></section>
<article class="article-page" id="article"><p class="empty">Đang tải...</p></article>
<section class="article-page extra" id="extra" hidden>
  <div class="comments" id="comments">
    <h2 class="sec-h small">Bình luận <span id="cn"></span></h2>
    <form id="cf" class="c-form" hidden><textarea id="ct" maxlength="1000" rows="3" placeholder="Viết bình luận của bạn..." required></textarea><div class="c-act"><span class="hint" id="cc">0/1000</span><button class="pill solid">Gửi bình luận</button></div><p class="auth-err" id="cerr" role="alert"></p></form>
    <div class="c-login" id="cl" hidden>Bạn cần <button class="link" id="clb">đăng nhập</button> để bình luận.</div>
    <div id="clist"></div>
  </div>
  <div class="related" id="related" hidden><h2 class="sec-h small">Bài viết liên quan</h2><div class="n-grid" id="rgrid"></div></div>
</section>
<script src="demo.js"></script>
<script src="embed.js"></script>
<script src="common.js"></script>
<script src="sponsors-map.js"></script>
<script src="layout.js"></script>
<script src="gallery.js"></script>
<script>
(async () => {
  const el = $('#article');
  const id = new URLSearchParams(location.search).get('id') || '';
  const [secs, all] = await Promise.all([getJSON('/api/sections', []), getJSON('/api/articles', [])]);
  let a = null;
  const r = await fetch('/api/articles/' + encodeURIComponent(id)).catch(() => null);
  if (r && r.ok) a = await r.json();
  if (a) fetch('/api/articles/' + encodeURIComponent(a.id) + '/view', { method: 'POST' }).catch(() => {});
  const pool = demoOr(all);
  if (!a) a = pool.find(x => x.id === id) || null;
  if (!a) { $('#ahead').innerHTML = '<h1>Không tìm thấy bài viết</h1>'; el.innerHTML = '<a class="back" href="index.html">← Về trang chủ</a>'; return; }
  if (!(a.tags || []).length && /^\s*</.test(a.content)) { // bài cũ: tách dòng "Hashtag: #A; #B" khỏi nội dung
    const m = a.content.match(/<p\b[^>]*>\s*(?:<[^>]+>\s*)*(?:hashtag|hash tag)\s*:?\s*([\s\S]*?)<\/p>/i);
    if (m) { const txt = m[1].replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').trim(); a.tags = txt.split(/\s*[;,]\s*|\s+(?=#)/).map(x => x.replace(/^#+/, '').trim()).filter(Boolean); a.content = a.content.replace(m[0], ''); }
  } else if (!(a.tags || []).length) {
    const m = a.content.match(/(?:^|\n)\s*(?:hashtag|hash tag)\s*:?\s*([^\n]+)/i);
    if (m) { a.tags = m[1].split(/\s*[;,]\s*|\s+(?=#)/).map(x => x.replace(/^#+/, '').trim()).filter(Boolean); a.content = a.content.replace(m[0], ''); }
  }
  const sec = secs.find(s => s.id === a.section);
  document.title = a.title + ' - CLB Bóng đá Công An Hà Nội';
  const body = `<div class="body rich">${/^\s*</.test(a.content) ? a.content : a.content.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('')}</div>`;
  const tagsHtml = (a.tags || []).length ? `<div class="tags"><span>Hashtag</span>${a.tags.map(g => `<a href="search.html?tag=${encodeURIComponent(g)}">#${esc(g)}</a>`).join('')}</div>` : '';
  const copyHtml = '<p class="copyright">© CLB Bóng đá Công An Hà Nội. Nội dung được bảo hộ bản quyền, nghiêm cấm sao chép dưới mọi hình thức khi chưa có sự đồng ý.</p>';
  const FB = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.44 18.63.07 12 .07S0 5.44 0 12.07c0 5.99 4.39 10.95 10.13 11.85v-8.38H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.69.24 2.69.24v2.95h-1.51c-1.49 0-1.96.93-1.96 1.87v2.25h3.33l-.53 3.47h-2.8v8.38C19.61 23.02 24 18.06 24 12.07z"/></svg>';
  const LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
  const share = `<div class="share"><a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" target="_blank" rel="noopener" title="Chia sẻ Facebook">${FB}</a><button type="button" class="cp" title="Sao chép liên kết">${LINK}</button></div>`;
  const secName = sec ? sec.name : '';
  const isPhoto = hasGallery(a), isVideo = !isPhoto && a.section === 'multimedia' && hasVideo(a);

  if (isPhoto) { // ----- bài hình ảnh: nền tối, chùm ảnh lướt -----
    document.body.classList.add('art-p');
    el.innerHTML = `<a class="ap-sec" href="section.html?s=${esc(a.section)}">${esc(secName)}</a><div id="gal"></div>
      <h1 class="ap-title">${esc(a.title)}</h1>${a.summary ? `<p class="ap-lead">${esc(a.summary)}</p>` : ''}
      <div class="ap-meta"><time>${fmtDate(a.createdAt)}</time>${a.author ? `<span>· ${esc(a.author)}</span>` : ''}${share}</div>
      ${tagsHtml}${hasVideo(a) ? videoBlock(a) : ''}${body}${copyHtml}`;
    Gallery.mount($('#gal'), a.gallery);
  } else if (isVideo) { // ----- bài video: kiểu báo điện tử -----
    document.body.classList.add('art-v');
    const ini = String(a.author || 'CLB').trim().split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase();
    el.innerHTML = `<a class="av-kick" href="section.html?s=${esc(a.section)}">${esc(secName)}</a>
      <h1 class="av-title">${esc(a.title)}</h1>
      <div class="av-meta"><div class="av-au"><i>${esc(ini)}</i><b>${esc(a.author || 'CLB Công An Hà Nội')}</b></div><time>${fmtDate(a.createdAt)}</time>${share}</div>
      ${a.summary ? `<p class="av-lead">${esc(a.summary)}</p>` : ''}${videoBlock(a)}${body}
      <div class="av-end">${share}</div><div id="relList"></div>
      ${(a.tags || []).length ? `<div class="kw"><h2>Từ khoá</h2>${a.tags.map(g => `<a href="search.html?tag=${encodeURIComponent(g)}">${esc(g)}</a>`).join('')}</div>` : ''}${copyHtml}`;
  } else { // ----- bài thường -----
    if (a.image) { const hero = document.querySelector('.article-hero'); hero.classList.add('has-img'); hero.style.backgroundImage = `linear-gradient(180deg,#0000 0%,#1a050466 38%,#1a0504e6 100%),linear-gradient(90deg,#1a0504cc 0%,#1a050433 70%),url("${encodeURI(a.image)}")`; }
    $('#ahead').innerHTML = `<a class="tag" href="section.html?s=${esc(a.section)}">${esc(secName)}</a><h1>${esc(a.title)}</h1><time>${fmtDate(a.createdAt)}</time>${a.author ? ` · <span class="au">${esc(a.author)}</span>` : ''}`;
    el.innerHTML = `${a.demo ? '<span class="demo-note">Bài viết mẫu</span>' : ''}${a.summary ? `<p class="lead">${esc(a.summary)}</p>` : ''}${videoBlock(a)}${body}${tagsHtml}${copyHtml}`;
  }
  el.querySelectorAll('.share .cp').forEach(b => b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(location.href); b.classList.add('ok'); b.title = 'Đã sao chép'; });
  el.classList.add('nocopy');
  antiCopy(el, $('#ahead'));

  // ----- bài viết liên quan -----
  const words = t => new Set(String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2));
  const mine = words(a.title + ' ' + a.summary);
  const rel = pool.filter(x => x.id !== a.id).map(x => {
    let sc = x.section === a.section ? 3 : 0; for (const w of words(x.title + ' ' + x.summary)) if (mine.has(w)) sc += 1; return { x, sc };
  }).sort((p, q) => q.sc - p.sc || q.x.createdAt - p.x.createdAt).slice(0, 4).map(o => o.x);
  $('#extra').hidden = false;
  if (isVideo && rel.length && $('#relList')) { $('#relList').innerHTML = `<div class="rel-list"><h2>Tin liên quan</h2>${rel.slice(0, 5).map(b => `<a href="${href(b)}">${esc(b.title)}</a>`).join('')}</div>`; rel.length = 0; }
  if (rel.length) { $('#related').hidden = false; $('#rgrid').innerHTML = rel.map((b, i) => `<a class="n-card" href="${href(b)}"><div class="th">${b.image ? `<img src="${esc(b.image)}" alt="" loading="lazy">` : `<div class="ph p${i % 5 + 1}"></div>`}${hasVideo(b) ? ICON_PLAY : ''}</div><h3>${esc(b.title)}</h3><time>${fmtDate(b.createdAt)}</time></a>`).join(''); }

  // ----- bình luận -----
  if (a.demo) { $('#comments').hidden = true; return; }
  let user = null;
  const draw = async () => {
    const list = await getJSON('/api/articles/' + encodeURIComponent(a.id) + '/comments', []);
    $('#cn').textContent = list.length ? '(' + list.length + ')' : '';
    $('#clist').innerHTML = list.length ? list.map(c => `<div class="cmt"><div class="cmt-h"><b>${esc(c.name)}</b><time>${fmtDate(c.createdAt)}</time>${c.mine ? `<button class="link del" data-id="${esc(c.id)}">Xoá</button>` : ''}</div><p>${esc(c.text).replace(/\n/g, '<br>')}</p></div>`).join('') : '<p class="empty">Chưa có bình luận. Hãy là người đầu tiên!</p>';
  };
  const sync = () => { $('#cf').hidden = !user; $('#cl').hidden = !!user; };
  document.addEventListener('me', e => { user = e.detail && e.detail.role ? e.detail : null; sync(); draw(); });
  user = me && me.role ? me : null; sync(); draw();
  $('#clb').onclick = () => openAuth('login');
  $('#ct').oninput = () => $('#cc').textContent = $('#ct').value.length + '/1000';
  $('#cf').addEventListener('submit', async e => {
    e.preventDefault(); $('#cerr').textContent = '';
    const r = await fetch('/api/articles/' + encodeURIComponent(a.id) + '/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: $('#ct').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('#cerr').textContent = d.error || 'Không thể gửi bình luận'; return; }
    $('#ct').value = ''; $('#cc').textContent = '0/1000'; draw();
  });
  $('#clist').addEventListener('click', async e => {
    const b = e.target.closest('.del'); if (!b || !confirm('Xoá bình luận này?')) return;
    await fetch('/api/comments/' + b.dataset.id, { method: 'DELETE' }); draw();
  });
})();

/* ----- chống sao chép nội dung (răn đe; không thể ngăn tuyệt đối) ----- */
function antiCopy(...zones) {
  const inZone = t => zones.some(z => z && z.contains(t));
  const editable = t => t && t.closest && t.closest('input,textarea,[contenteditable]');
  const NOTE = 'Nội dung thuộc bản quyền CLB Bóng đá Công An Hà Nội. Vui lòng không sao chép.';
  for (const ev of ['copy', 'cut']) document.addEventListener(ev, e => { if (inZone(e.target) || inZone((getSelection().anchorNode || {}).parentNode)) { e.preventDefault(); e.clipboardData && e.clipboardData.setData('text/plain', NOTE); } });
  for (const ev of ['contextmenu', 'dragstart', 'selectstart']) document.addEventListener(ev, e => { if (inZone(e.target) && !editable(e.target)) e.preventDefault(); });
  document.addEventListener('keydown', e => {
    if (editable(e.target)) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 's', 'p', 'u'].includes(k)) e.preventDefault();
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
  });
}
</script>
</body>
</html>
